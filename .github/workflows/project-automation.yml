name: "Project Automation"

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, closed, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

env:
  PROJECT_ID: "PVT_kwHOAeOTfc4BZzTY"
  ASSIGNEE: "overwrite00"

jobs:
  add-to-project:
    name: "Add to Project & Assign"
    runs-on: ubuntu-latest

    steps:
      - name: "Assign and Add to Project"
        env:
          # Passate come env var (non interpolate direttamente nello script) per
          # evitare script injection: il titolo PR/Issue è testo arbitrario
          # controllato da chi apre la PR/Issue.
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GH_PROJECT_TOKEN }}"

          # Nota: i workflow attivati da Dependabot ricevono SOLO i Dependabot secrets.
          # GH_PROJECT_TOKEN deve essere registrato anche in Settings > Secrets > Dependabot.
          if [ -z "$TOKEN" ]; then
            echo "::error::GH_PROJECT_TOKEN is empty. If this run was triggered by Dependabot (actor: ${{ github.actor }}), register the same token as a Dependabot secret: Settings > Secrets and variables > Dependabot."
            exit 1
          fi

          # Se Issue
          if [ "${{ github.event_name }}" = "issues" ]; then
            ITEM_ID="${{ github.event.issue.node_id }}"
            ISSUE_NUM="${{ github.event.issue.number }}"

            echo "Processing Issue #$ISSUE_NUM..."

            # Assegna Issue
            echo "  - Assigning to ${{ env.ASSIGNEE }}..."
            curl -s -X PATCH \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"assignees\":[\"${{ env.ASSIGNEE }}\"]}" \
              "https://api.github.com/repos/$REPO/issues/$ISSUE_NUM" > /dev/null
            echo "    Assigned"

            # Aggiungi al Project
            echo "  - Adding to Project..."

            PAYLOAD=$(jq -n \
              --arg query 'mutation($projectId:ID!, $itemId:ID!) { addProjectV2ItemById(input: {projectId: $projectId, contentId: $itemId}) { item { id } } }' \
              --arg projectId "${{ env.PROJECT_ID }}" \
              --arg itemId "$ITEM_ID" \
              '{query: $query, variables: {projectId: $projectId, itemId: $itemId}}')

            RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/graphql")

            if echo "$RESPONSE" | jq -e '.data.addProjectV2ItemById.item.id' > /dev/null 2>&1; then
              echo "    Added to Project"
            else
              echo "::error::Failed to add Issue #$ISSUE_NUM to Project"
              echo "    Details: $(echo "$RESPONSE" | jq '.errors // .message')"
              exit 1
            fi

            # Auto-label — nessun automatismo etichettava mai le issue finora
            echo "  - Auto-labeling..."

            TITLE="$ISSUE_TITLE"
            LABELS=()

            case "$TITLE" in
              bug:*|bug\(*|Bug:*|\[Bug\]*|\[bug\]*) LABELS+=("type:bug") ;;
              feat:*|feat\(*|Feat:*|Feature:*|\[Feature\]*|\[feature\]*) LABELS+=("type:feature") ;;
              docs:*|docs\(*|Doc:*|\[Docs\]*|\[docs\]*) LABELS+=("type:docs") ;;
              question:*|Question:*|\[Question\]*|\[question\]*) LABELS+=("question") ;;
              *) LABELS+=("type:chore") ;;
            esac

            JSON_LABELS=$(printf '%s\n' "${LABELS[@]}" | sort -u | jq -R . | jq -s .)
            curl -s -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"labels\":$JSON_LABELS}" \
              "https://api.github.com/repos/$REPO/issues/$ISSUE_NUM/labels" > /dev/null
            echo "    Labels applied: $(echo "$JSON_LABELS" | jq -r 'join(" ")')"
          fi

          # Se Pull Request
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ITEM_ID="${{ github.event.pull_request.node_id }}"
            PR_NUM="${{ github.event.pull_request.number }}"
            PR_ACTION="${{ github.event.action }}"

            echo "Processing PR #$PR_NUM ($PR_ACTION)..."

            # Assegna PR
            echo "  - Assigning to ${{ env.ASSIGNEE }}..."
            curl -s -X PATCH \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"assignees\":[\"${{ env.ASSIGNEE }}\"]}" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUM" > /dev/null
            echo "    Assigned"

            # Aggiungi al Project (solo se opened o reopened)
            if [ "$PR_ACTION" = "opened" ] || [ "$PR_ACTION" = "reopened" ]; then
              echo "  - Adding to Project..."

              PAYLOAD=$(jq -n \
                --arg query 'mutation($projectId:ID!, $itemId:ID!) { addProjectV2ItemById(input: {projectId: $projectId, contentId: $itemId}) { item { id } } }' \
                --arg projectId "${{ env.PROJECT_ID }}" \
                --arg itemId "$ITEM_ID" \
                '{query: $query, variables: {projectId: $projectId, itemId: $itemId}}')

              RESPONSE=$(curl -s -X POST \
                -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "https://api.github.com/graphql")

              if echo "$RESPONSE" | jq -e '.data.addProjectV2ItemById.item.id' > /dev/null 2>&1; then
                echo "    Added to Project"
              else
                echo "::error::Failed to add PR #$PR_NUM to Project"
                echo "    Details: $(echo "$RESPONSE" | jq '.errors // .message')"
                exit 1
              fi

              # Auto-label (solo PR aperte manualmente — Dependabot si etichetta
              # già da sé tramite dependabot.yml, non serve/non va duplicato qui)
              if [ "${{ github.actor }}" != "dependabot[bot]" ]; then
                echo "  - Auto-labeling..."

                TITLE="$PR_TITLE"
                LABELS=()

                case "$TITLE" in
                  fix:*|fix\(*|Fix:*|Fix\(*|hotfix:*|Hotfix:*) LABELS+=("type:bug") ;;
                  feat:*|feat\(*|Feat:*|Feature:*) LABELS+=("type:feature") ;;
                  docs:*|docs\(*|Doc:*|Doc\(*) LABELS+=("type:docs") ;;
                  ci:*|ci\(*|CI:*) LABELS+=("type:ci") ;;
                  *) LABELS+=("type:chore") ;;
                esac

                FILES=$(curl -s -H "Authorization: token $TOKEN" \
                  "https://api.github.com/repos/$REPO/pulls/$PR_NUM/files?per_page=100" \
                  | jq -r '.[].filename')

                echo "$FILES" | grep -q '^src/ui/' && LABELS+=("scope:frontend"); true
                echo "$FILES" | grep -qE '^src/(core|utils)/|^src/main\.py' && LABELS+=("scope:core"); true
                echo "$FILES" | grep -qE '^\.github/workflows/|^\.github/dependabot\.yml' && LABELS+=("type:ci"); true
                echo "$FILES" | grep -qE '(^|/)requirements(-dev)?\.txt$|(^|/)pyproject\.toml$' && LABELS+=("dependencies"); true
                echo "$FILES" | grep -q '\.py$' && LABELS+=("lang:python"); true

                UNIQUE_LABELS=$(printf '%s\n' "${LABELS[@]}" | sort -u)
                echo "    Computed: $(echo "$UNIQUE_LABELS" | tr '\n' ' ')"

                JSON_LABELS=$(echo "$UNIQUE_LABELS" | jq -R . | jq -s .)
                curl -s -X POST \
                  -H "Authorization: token $TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -d "{\"labels\":$JSON_LABELS}" \
                  "https://api.github.com/repos/$REPO/issues/$PR_NUM/labels" > /dev/null
                echo "    Labels applied"
              fi
            fi

            # Se PR è stato chiuso
            if [ "$PR_ACTION" = "closed" ]; then
              echo "  - PR closed"
              PR_MERGED="${{ github.event.pull_request.merged }}"
              if [ "$PR_MERGED" = "true" ]; then
                echo "    PR merged - Item will auto-transition in Project"
              fi
            fi
          fi

      - name: "Workflow Summary"
        if: always()
        run: |
          echo "Project automation completed"
          echo "Project ID: ${{ env.PROJECT_ID }}"
          echo "Assignee: ${{ env.ASSIGNEE }}"
